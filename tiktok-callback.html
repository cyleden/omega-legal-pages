<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 授權完成</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; line-height: 1.7; color: #222; text-align: center; }
  h1 { font-size: 22px; }
  .code-box { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 24px 0; word-break: break-all; font-family: monospace; font-size: 15px; }
  button { background: #fe2c55; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .hint { color: #666; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>✅ TikTok 授權完成</h1>
  <p>請把下面的授權碼（code）複製，貼到終端機腳本裡繼續。</p>
  <div class="code-box" id="codeBox">讀取中...</div>
  <button onclick="copyCode()">複製授權碼</button>
  <p class="hint">這個授權碼幾分鐘內就會失效，請盡快複製使用。</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const box = document.getElementById('codeBox');

  if (code) {
    box.textContent = code;
  } else if (error) {
    box.textContent = '授權失敗：' + error;
  } else {
    box.textContent = '（沒有偵測到授權碼，請確認網址列是否有 ?code=... 參數）';
  }

  function copyCode() {
    navigator.clipboard.writeText(box.textContent).then(() => {
      alert('已複製到剪貼簿');
    });
  }
</script>
</body>
</html>
